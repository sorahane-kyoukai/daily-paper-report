  # ============================================================
  # TIER 1 - arXiv Paper Categories (via API for full lookback support)
  # Using arxiv_api method instead of rss_atom to support --lookback parameter
  # for fetching papers over configurable date ranges (e.g., 7 days).
  # max_items=0 keeps the full time window and lets ranking decide the final 70.
  # ============================================================

  - id: arxiv-cs-ai
    name: arXiv cs.AI
    url: https://export.arxiv.org/api/query
    tier: 1
    method: arxiv_api
    kind: paper
    timezone: UTC
    max_items: 0
    query: 'cat:cs.AI'

  - id: arxiv-cs-lg
