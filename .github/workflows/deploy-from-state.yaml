name: Deploy From State

"on":
  workflow_dispatch:
    inputs:
      state_ref:
        description: "State branch, tag, or SHA to deploy."
        required: false
        type: string
        default: state

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: digest-deploy
  cancel-in-progress: false

env:
  OUTPUT_DIR: public
  STATE_BRANCH: state
  STATE_FILE: state.sqlite

jobs:
  deploy-pages:
    name: Deploy Pages From State
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Restore state branch payload
        id: restore-state
        run: |
          STATE_REF="${{ inputs.state_ref }}"
          if [ -z "${STATE_REF}" ]; then
            STATE_REF="${STATE_BRANCH}"
          fi

          git fetch --depth=1 origin "${STATE_REF}"
          STATE_COMMIT=$(git rev-parse FETCH_HEAD)
          echo "state_commit=${STATE_COMMIT}" >> "$GITHUB_OUTPUT"

          rm -rf "${OUTPUT_DIR}"
          mkdir -p "${OUTPUT_DIR}/api/day" "${OUTPUT_DIR}/api/reports" \
            "${OUTPUT_DIR}/day" "${OUTPUT_DIR}/reports"

          restore_tree() {
            local tree_path="$1"
            git ls-tree -r --name-only "${STATE_COMMIT}" "${tree_path}" 2>/dev/null |
              while IFS= read -r file; do
                [ -n "${file}" ] || continue
                mkdir -p "$(dirname "${OUTPUT_DIR}/${file}")"
                git show "${STATE_COMMIT}:${file}" > "${OUTPUT_DIR}/${file}"
              done
          }

          restore_file() {
            local file="$1"
            local target="${2:-${OUTPUT_DIR}/${file}}"
            if git cat-file -e "${STATE_COMMIT}:${file}" 2>/dev/null; then
              mkdir -p "$(dirname "${target}")"
              git show "${STATE_COMMIT}:${file}" > "${target}"
            fi
          }

          restore_tree "api/day/"
          restore_tree "api/reports/"
          restore_tree "day/"
          restore_tree "reports/"

          restore_file "api/daily.json"
          restore_file "api/llm_scores.json"
          restore_file "api/translations_zh.json"

          if ! git show "${STATE_COMMIT}:${STATE_FILE}" > "${STATE_FILE}" 2>/dev/null; then
            echo "::error::Missing ${STATE_FILE} in ${STATE_REF}."
            exit 1
          fi

          if ! head -c 15 "${STATE_FILE}" | grep -q "SQLite format 3"; then
            echo "::error::Restored ${STATE_FILE} is not a SQLite database."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Build Vue.js frontend
        run: |
          cd frontend
          pnpm install --frozen-lockfile
          pnpm run build-only

          cp dist/index.html "../${OUTPUT_DIR}/"
          cp dist/index.html "../${OUTPUT_DIR}/404.html"
          rm -rf "../${OUTPUT_DIR}/assets"
          cp -r dist/assets "../${OUTPUT_DIR}/"

          for ROUTE in archive sources status reports; do
            mkdir -p "../${OUTPUT_DIR}/${ROUTE}"
            cp dist/index.html "../${OUTPUT_DIR}/${ROUTE}.html"
            cp dist/index.html "../${OUTPUT_DIR}/${ROUTE}/index.html"
          done

      - name: Prepare archive output
        run: |
          GENERATED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          mkdir -p "${OUTPUT_DIR}/api/day" "${OUTPUT_DIR}/day" \
            "${OUTPUT_DIR}/reports/weekly" "${OUTPUT_DIR}/reports/monthly"

          cp "${STATE_FILE}" "${OUTPUT_DIR}/api/state.sqlite"

          if [ ! -f "${OUTPUT_DIR}/api/daily.json" ]; then
            echo "::error::Missing ${OUTPUT_DIR}/api/daily.json from state payload."
            exit 1
          fi

          DATES=$(find "${OUTPUT_DIR}/api/day" -maxdepth 1 -name "*.json" -printf "%f\n" | sed 's/\.json$//' | sort -r)
          DATES_JSON=$(echo "${DATES}" | jq -R -s 'split("\n") | map(select(length > 0))')

          jq --argjson dates "${DATES_JSON}" '.archive_dates = $dates' \
            "${OUTPUT_DIR}/api/daily.json" > "${OUTPUT_DIR}/api/daily.json.tmp"
          mv "${OUTPUT_DIR}/api/daily.json.tmp" "${OUTPUT_DIR}/api/daily.json"

          if [ ! -f "${OUTPUT_DIR}/api/reports/index.json" ]; then
            mkdir -p "${OUTPUT_DIR}/api/reports"
            cat > "${OUTPUT_DIR}/api/reports/index.json" <<EOF
          {
            "generated_at": "${GENERATED_AT}",
            "latest": {
              "weekly": null,
              "monthly": null
            },
            "weekly": [],
            "monthly": []
          }
          EOF
          fi

          for JSON_FILE in "${OUTPUT_DIR}/api/day/"*.json; do
            [ -f "${JSON_FILE}" ] || continue
            DATE=$(basename "${JSON_FILE}" .json)
            cp "${OUTPUT_DIR}/index.html" "${OUTPUT_DIR}/day/${DATE}.html"
          done

          for REPORT_TYPE in weekly monthly; do
            for JSON_FILE in "${OUTPUT_DIR}/api/reports/${REPORT_TYPE}/"*.json; do
              [ -f "${JSON_FILE}" ] || continue
              PERIOD=$(basename "${JSON_FILE}" .json)
              mkdir -p "${OUTPUT_DIR}/reports/${REPORT_TYPE}"
              cp "${OUTPUT_DIR}/index.html" "${OUTPUT_DIR}/reports/${REPORT_TYPE}/${PERIOD}.html"
            done
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.OUTPUT_DIR }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Summary
        if: always()
        run: |
          {
            echo "## Deploy From State"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| State ref | ${{ inputs.state_ref }} |"
            echo "| State commit | ${{ steps.restore-state.outputs.state_commit }} |"
            echo "| Job status | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"
